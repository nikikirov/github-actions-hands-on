name: Scheduled Cron Workflow

on:
  schedule:
    # Изпълнение на всеки 5 минути (за тестови цели)
    - cron: "*/5 * * * *"

jobs:
  cron-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Scheduled Execution Time
        run: |
          echo "Scheduled job executed at: $(date)"
          echo "Cron Trigger Context: ${{ github.event.schedule }}"